services:
  - type: web
    name: affiguard-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: FLASK_ENV
        value: production
      - key: ENABLE_PLAYWRIGHT
        value: false
      - key: FREE_CHECKER_LIMIT
        value: "10"
